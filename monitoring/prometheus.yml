global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'quickserve-production'
    environment: 'prod'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # QuickServe Application Metrics
  - job_name: 'quickserve'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['quickserve:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '([^:]+)'
        target_label: __address__
        replacement: '${1}:8080'

  # PostgreSQL Metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Kafka Metrics
  - job_name: 'kafka'
    static_configs:
      - targets:
          - 'kafka-1:9092'
          - 'kafka-2:9092'
          - 'kafka-3:9092'

  # Node Exporter (System metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # NGINX Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
