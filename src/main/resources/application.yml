spring:
  application:
    name: quickserve-delivery-platform

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:quickserve
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # H2 Console for debugging
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Application Configuration
quickserve:
  delivery:
    base-delivery-fee: 2.99
    per-km-charge: 0.50
    max-delivery-radius-km: 15
  payment:
    processing-fee-percent: 2.5
  notification:
    enabled: true
