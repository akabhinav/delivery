---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: quickserve

---
# ConfigMap for Application Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickserve-config
  namespace: quickserve
data:
  SPRING_PROFILES_ACTIVE: "prod"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"

---
# Secret for Sensitive Data
apiVersion: v1
kind: Secret
metadata:
  name: quickserve-secret
  namespace: quickserve
type: Opaque
stringData:
  DB_USERNAME: "quickserve"
  DB_PASSWORD: "quickserve123"
  REDIS_PASSWORD: ""

---
# Deployment for QuickServe Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickserve-deployment
  namespace: quickserve
  labels:
    app: quickserve
spec:
  replicas: 20  # Start with 20, scale up to 100+ with HPA
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: quickserve
  template:
    metadata:
      labels:
        app: quickserve
        version: v1
    spec:
      containers:
      - name: quickserve
        image: quickserve/delivery-platform:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: quickserve-config
        - secretRef:
            name: quickserve-secret
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

---
# Service for QuickServe
apiVersion: v1
kind: Service
metadata:
  name: quickserve-service
  namespace: quickserve
spec:
  selector:
    app: quickserve
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quickserve-hpa
  namespace: quickserve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quickserve-deployment
  minReplicas: 20
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quickserve-pdb
  namespace: quickserve
spec:
  minAvailable: 10
  selector:
    matchLabels:
      app: quickserve

---
# Ingress for Load Balancing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickserve-ingress
  namespace: quickserve
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
spec:
  tls:
  - hosts:
    - api.quickserve.com
    secretName: quickserve-tls
  rules:
  - host: api.quickserve.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quickserve-service
            port:
              number: 80

---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: quickserve
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: quickserve
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
# Network Policy for Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quickserve-network-policy
  namespace: quickserve
spec:
  podSelector:
    matchLabels:
      app: quickserve
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
